services:
  - type: web
    name: farmpass-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput && python manage.py migrate --settings=config.settings.prod && python manage.py createcachetable --settings=config.settings.prod
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 2 --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false  # Paste your Neon connection string in the Render dashboard
      # Cloudinary (media storage)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # PayMongo
      - key: PAYMONGO_TEST_SECRET_KEY
        sync: false
      - key: PAYMONGO_TEST_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_URL
        sync: false
      - key: FRONTEND_URL
        value: https://farmpass-ph.me
      # OCR
      - key: OCR_API_URL
        sync: false
      - key: OCR_API_KEY
        sync: false
      - key: OCR_PROVIDER_CHAIN
        value: ocrspace
      # SMS
      - key: SMS_BASE_URL
        sync: false
      - key: SMS_USERNAME
        sync: false
      - key: SMS_PASSWORD
        sync: false
      # Gemini AI
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Security
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: FIELD_ENCRYPTION_KEY
        sync: false

